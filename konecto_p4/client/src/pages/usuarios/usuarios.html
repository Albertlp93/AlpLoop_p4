<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Konecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../dashboard/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">KONECTO<span>.</span></div>
            <ul class="nav-links" id="nav-menu">
                <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
                <li><a href="../publicaciones/publicaciones.html">Ofertas y Demandas</a></li>
                <li><a href="../perfil/perfil.html">Mi Perfil</a></li>
                </ul>
        </div>
        <div class="user-pill">
            <div class="user-data">
                <span id="user-display" class="user-name">Admin</span>
                <span id="role-badge" class="role-badge">ADMIN</span>
            </div>
            <button id="logoutBtn" class="btn-logout">Salir</button>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="content-section shadow-sm" style="border-radius: 30px; background: white; padding: 40px;">
            <div class="section-title d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Gestión de Usuarios</h2>
                <span class="badge rounded-pill px-3 py-2" style="background: var(--rosa-fosfo);">ADMIN PANEL</span>
            </div>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">
                            <th class="ps-4">Nombre</th>
                            <th>Email</th>
                            <th>Password (Hash)</th>
                            <th>Rol</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuariosBody">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalEditUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 25px; border: none;">
                <div class="modal-header border-0 p-4 pb-0">
                    <h5 class="modal-title fw-bold">Editar Información de Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEditUser">
                        <input type="hidden" id="edit-user-id">
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">NOMBRE COMPLETO</label>
                            <input type="text" id="edit-user-nombre" class="form-control rounded-3" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">CORREO ELECTRÓNICO</label>
                            <input type="email" id="edit-user-email" class="form-control rounded-3" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">CONTRASEÑA (NUEVA)</label>
                            <input type="password" id="edit-user-pass" class="form-control rounded-3" placeholder="Dejar en blanco para no cambiar">
                            <div class="form-text">Si escribes aquí, se actualizará la clave del usuario.</div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">ROL DEL SISTEMA</label>
                            <select id="edit-user-role" class="form-select rounded-3">
                                <option value="USER">USER</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>

                        <button type="submit" class="btn w-100 p-3 fw-bold text-white shadow-sm" style="background: var(--rosa-fosfo); border-radius: 15px;">
                            GUARDAR CAMBIOS
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="usuarios.js"></script>
</body>
</html>
