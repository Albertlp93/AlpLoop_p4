<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas y Demandas - Konecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="ofertas_demandas.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">KONECTO<span>.</span></div>
            <ul class="nav-links" id="nav-menu">
                <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
                <li><a href="publicaciones.html" class="active">Ofertas y Demandas</a></li>
                <li><a href="../perfil/perfil.html">Mi Perfil</a></li>
            </ul>
        </div>
        <div class="user-pill">
            <div class="user-data">
                <span id="user-display" class="user-name">Cargando...</span>
                <span id="role-badge" class="role-badge">...</span>
            </div>
            <button id="logoutBtn" class="btn-logout">Salir</button>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="form-empleos shadow bg-white" style="border-radius: 25px; overflow: hidden;">
                    <div class="form-empleos-header p-4 text-center" style="background: var(--rosa-fosfo); color: white;">
                        <h2 class="mb-0 fw-bold">NUEVA PUBLICACIÓN</h2>
                    </div>
                    <div class="form-empleos-body p-4">
                        <form id="formPublicar">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tipo de Publicación</label>
                                <select id="tipo" class="form-select" required>
                                    <option value="" disabled selected>Selecciona...</option>
                                    <option value="OFERTA">Oferta de Empleo</option>
                                    <option value="DEMANDA">Demanda de Empleo</option>
                                </select>
                            </div>
                            <div id="camposDinamicos" class="d-none">
                                <div class="mb-3">
                                    <label class="form-label fw-bold" id="labelTitulo">Título</label>
                                    <input type="text" id="titulo" class="form-control" required>
                                </div>
                                <div class="row">
                                    <div class="col-6 mb-3">
                                        <label class="form-label fw-bold">Jornada</label>
                                        <select id="jornada" class="form-select">
                                            <option value="Completa">Completa</option>
                                            <option value="Parcial">Parcial</option>
                                        </select>
                                    </div>
                                    <div class="col-6 mb-3 d-none" id="grupoSueldo">
                                        <label class="form-label fw-bold">Sueldo Anual (€)</label>
                                        <input type="number" id="sueldo" class="form-control" min="0">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Descripción</label>
                                    <textarea id="descripcion" class="form-control" rows="3" required></textarea>
                                </div>
                                <button type="submit" class="btn w-100 p-3 fw-bold border-0 text-white" style="background: var(--rosa-fosfo); border-radius: 15px;">PUBLICAR</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="tabla-empleos-wrapper h-100 shadow bg-white d-flex flex-column" style="border-radius: 25px;">
                    <div class="tabla-empleos-header p-3 text-center border-bottom fw-bold">RESUMEN DE MIS DATOS</div>
                    <div class="flex-grow-1 p-4 d-flex flex-column align-items-center justify-content-center">
                        <div style="position: relative; height:220px; width:220px">
                            <canvas id="graficoPublicaciones"></canvas>
                        </div>
                        <div class="mt-3 text-center">
                            <h3 id="total-count" class="fw-bold mb-0" style="color: var(--rosa-fosfo);">0</h3>
                            <p class="text-muted small fw-bold text-uppercase">Total Publicaciones</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 mb-5">
                <div class="tabla-empleos-wrapper shadow bg-white" style="border-radius: 25px; overflow: hidden;">
                    <div class="tabla-empleos-header p-3 text-center border-bottom fw-bold bg-light">MIS PUBLICACIONES ACTIVAS</div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">TIPO</th>
                                    <th>DETALLES</th>
                                    <th>INFO</th>
                                    <th>CONTACTO</th>
                                    <th class="text-center">ACCIÓN</th>
                                </tr>
                            </thead>
                            <tbody id="tablaPublicacionesBody">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 25px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Editar Publicación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEditar">
                        <input type="hidden" id="edit-id">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Título</label>
                            <input type="text" id="edit-titulo" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Jornada</label>
                                <select id="edit-jornada" class="form-select">
                                    <option value="Completa">Completa</option>
                                    <option value="Parcial">Parcial</option>
                                </select>
                            </div>
                            <div class="col-6 mb-3" id="grupoSueldoModal">
                                <label class="form-label fw-bold">Sueldo (€)</label>
                                <input type="number" id="edit-sueldo" class="form-control" min="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción</label>
                            <textarea id="edit-descripcion" class="form-control" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn w-100 p-3 fw-bold border-0 text-white" style="background: var(--rosa-fosfo); border-radius: 15px;">GUARDAR CAMBIOS</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="http://localhost:4000/socket.io/socket.io.js"></script>
    <script src="publicaciones.js"></script>
</body>
</html>
